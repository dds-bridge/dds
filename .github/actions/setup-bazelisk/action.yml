name: Setup Bazelisk
description: Install Bazelisk with one retry, then verify it is on PATH
inputs:
  bazelisk-version:
    description: Bazelisk version to install
    required: false
    default: "1.29.0"
runs:
  using: composite
  steps:
    - name: Setup Bazelisk (attempt 1)
      id: setup_bazelisk_1
      continue-on-error: true
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-version: ${{ inputs.bazelisk-version }}

    - name: Setup Bazelisk (attempt 2)
      id: setup_bazelisk_2
      if: steps.setup_bazelisk_1.outcome != 'success'
      continue-on-error: false
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-version: ${{ inputs.bazelisk-version }}

    # pwsh is available on all GitHub-hosted runners (Linux/macOS/Windows) and
    # matches the Windows CI job's shell, so we avoid a Bash-only dependency.
    - name: Verify Bazelisk installation
      shell: pwsh
      run: |
        bazelisk version
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to install Bazelisk after two setup attempts, or Bazelisk is not available on PATH."
          exit 1
        }
