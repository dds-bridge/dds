name: CI – macOS

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  build_and_test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Bazelisk (recommended Bazel launcher)
      - name: Setup Bazelisk (attempt 1)
        id: setup_bazelisk_1
        continue-on-error: true
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: "1.29.0"

      - name: Setup Bazelisk (attempt 2)
        id: setup_bazelisk_2
        if: steps.setup_bazelisk_1.outcome != 'success'
        continue-on-error: false
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: "1.29.0"

      - name: Verify Bazelisk installation
        run: bazelisk version || (echo "Failed to install Bazelisk after two setup attempts, or Bazelisk is not available on PATH." && exit 1)

      # Install Doxygen, to generate documentation
      - name: Install Doxygen
        run: brew install doxygen

      # Prefetch external repos (emsdk via //..., LLVM); retry network flakes only
      - name: Prefetch external repos
        run: |
          max=3
          for i in $(seq 1 "$max"); do
            if bazelisk fetch //...; then
              exit 0
            fi
            if [ "$i" -lt "$max" ]; then
              echo "Fetch failed (attempt $i/$max). Retrying in 20s..."
              sleep 20
            fi
          done
          exit 1

      # Build all targets
      - name: Build all targets
        run: bazelisk build --verbose_failures //...

      # Run all tests (including Python)
      - name: Run all tests
        run: bazelisk test --verbose_failures //...

      # Upload test logs
      - name: Upload test logs - macOS
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bazel-test-logs-macos
          path: bazel-testlogs/
          if-no-files-found: ignore
          retention-days: 30

  sanitizers:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bazelisk (attempt 1)
        id: setup_bazelisk_1
        continue-on-error: true
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: "1.29.0"

      - name: Setup Bazelisk (attempt 2)
        id: setup_bazelisk_2
        if: steps.setup_bazelisk_1.outcome != 'success'
        continue-on-error: false
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: "1.29.0"

      - name: Verify Bazelisk installation
        run: bazelisk version || (echo "Failed to install Bazelisk after two setup attempts, or Bazelisk is not available on PATH." && exit 1)

      - name: Prefetch external repos
        run: |
          max=3
          for i in $(seq 1 "$max"); do
            if bazelisk fetch --config=asan //library/tests/system/... \
              && bazelisk fetch --config=tsan //library/tests/system/...; then
              exit 0
            fi
            if [ "$i" -lt "$max" ]; then
              echo "Fetch failed (attempt $i/$max). Retrying in 20s..."
              sleep 20
            fi
          done
          exit 1

      - name: Run system tests (AddressSanitizer)
        run: bazelisk test --config=asan --verbose_failures --test_output=errors //library/tests/system/...

      - name: Run system tests (ThreadSanitizer)
        run: bazelisk test --config=tsan --verbose_failures --test_output=errors //library/tests/system/...

      - name: Upload sanitizer test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bazel-test-logs-macos-sanitizers
          path: bazel-testlogs/
          if-no-files-found: ignore
          retention-days: 30