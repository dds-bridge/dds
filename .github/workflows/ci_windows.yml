name: CI – Windows

on:
  pull_request:
    branches: [main, develop]
  # Merges to default branches save the Bazel disk cache that PRs restore
  # (PRs set cache-save: false so their post-step stays short).
  push:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  # Native MSVC path (library, examples, Python, JNI, …). Excludes //wasm and
  # //web so emsdk does not dominate this job's wall clock.
  build_and_test:
    runs-on: windows-latest
    # PRs stay at 20m; pushes that save the disk cache need ~6m more headroom.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 30 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazelisk
        uses: ./.github/actions/setup-bazelisk
        with:
          # PRs restore but do not save: cold builds already take ~10–14m, and
          # uploading the disk cache has cancelled jobs past the 20m budget.
          cache-save: ${{ github.event_name != 'pull_request' }}

      # Optional BuildBuddy remote cache (item 3). When the repo secret is set,
      # cold MSVC compiles hit a shared cache; when unset this step is a no-op.
      - name: Configure BuildBuddy remote cache
        shell: pwsh
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if (-not $env:BUILDBUDDY_API_KEY) {
            Write-Host "BUILDBUDDY_API_KEY unset; skipping remote cache."
            exit 0
          }
          $bazelrc = Join-Path $HOME ".bazelrc"
          @"
          # Added by CI – Windows (remote cache).
          common --remote_cache=grpcs://remote.buildbuddy.io
          common --remote_timeout=30
          common --remote_header=x-buildbuddy-api-key=$env:BUILDBUDDY_API_KEY
          "@ | Out-File -FilePath $bazelrc -Append -Encoding utf8

      # Build then test in one step so the Bazel server (and analysis cache)
      # stays warm. No standalone fetch: repository-cache covers downloads;
      # build retries handle transient fetch flakes.
      # --config=opt: DDS_CPPOPTS no longer forces /O2 (that fought Bazel's /Od and
      # triggered MSVC D9025); opt mode is how Windows keeps release-level codegen.
      - name: Bazel build and test
        shell: pwsh
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            bazelisk build --config=opt --verbose_failures '--' '//...' '-//wasm/...' '-//web/...'
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt $max) {
              Write-Host "Build failed (attempt $i/$max). Retrying in 20s..."
              Start-Sleep -Seconds 20
              # Restart server only — keep downloaded external repos / disk cache.
              bazelisk shutdown || $true
            } else {
              exit 1
            }
          }
          # Same server as the successful build — do not shut down here.
          bazelisk test --config=opt --verbose_failures --test_output=errors '--' '//...' '-//wasm/...' '-//web/...'
          exit $LASTEXITCODE

      # .NET binding lives in CI – Windows .NET (ci_windows_dotnet.yml).

      # Python wheel: the build above already produces dds3_wheel_dist as a
      # side effect, but that alone never runs `pip install` on the packaged
      # .whl, so a mistagged or incomplete archive would go unnoticed. 3.14
      # matches the cp314 tag dds3_wheel sets for its compiled _dds3
      # extension (see python/BUILD.bazel). --config=opt matches every other
      # bazelisk build invocation on this job (avoids MSVC D9025).
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build and smoke-test Python wheel
        shell: pwsh
        run: |
          bazelisk build --config=opt --verbose_failures //python:dds3_wheel_dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem -Path "bazel-bin/python/dist" -Filter *.whl | Select-Object -First 1
          if (-not $wheel) { Write-Error "no wheel found in bazel-bin/python/dist"; exit 1 }
          python -m venv "$env:RUNNER_TEMP/dds3_wheel_venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/dds3_wheel_venv/Scripts/pip.exe" install --no-index --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/dds3_wheel_venv/Scripts/python.exe" -c "import dds3; assert dds3.api_root() == 'dds.hpp'; print('dds3 wheel OK:', dds3.__file__)"
          exit $LASTEXITCODE

      - name: Upload test logs - Windows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-test-logs-windows
          path: bazel-testlogs/
          if-no-files-found: ignore
          retention-days: 30

  # Windows-host emsdk / wasm transition coverage (parallel with native).
  wasm_web:
    runs-on: windows-latest
    # PRs stay at 20m; pushes that save the disk cache need ~6m more headroom.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 30 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazelisk
        uses: ./.github/actions/setup-bazelisk
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Configure BuildBuddy remote cache
        shell: pwsh
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if (-not $env:BUILDBUDDY_API_KEY) {
            Write-Host "BUILDBUDDY_API_KEY unset; skipping remote cache."
            exit 0
          }
          $bazelrc = Join-Path $HOME ".bazelrc"
          @"
          # Added by CI – Windows (remote cache).
          common --remote_cache=grpcs://remote.buildbuddy.io
          common --remote_timeout=30
          common --remote_header=x-buildbuddy-api-key=$env:BUILDBUDDY_API_KEY
          "@ | Out-File -FilePath $bazelrc -Append -Encoding utf8

      - name: Bazel build and test
        shell: pwsh
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            bazelisk build --config=opt --verbose_failures //wasm/... //web/...
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt $max) {
              Write-Host "Build failed (attempt $i/$max). Retrying in 20s..."
              Start-Sleep -Seconds 20
              bazelisk shutdown || $true
            } else {
              exit 1
            }
          }
          # Same server as the successful build — do not shut down here.
          bazelisk test --config=opt --verbose_failures --test_output=errors //wasm/... //web/...
          exit $LASTEXITCODE

      - name: Upload test logs - Windows wasm/web
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-test-logs-windows-wasm-web
          path: bazel-testlogs/
          if-no-files-found: ignore
          retention-days: 30
