# .github/workflows/ci_linux.yml
name: CI – Linux

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install Bazelisk (recommended Bazel launcher)
      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: "1.25.0"

      # 3️⃣ (Optional) Install Doxygen for documentation generation
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      # 4️⃣ Build Python extension
      - name: Build Python extension
        run: bazel build //python:_dds3

      # 5️⃣ Build everything
      - name: Build all targets
        run: bazel build //...

      # 6️⃣ Run Python smoke test
      - name: Run Python smoke test
        run: bazel test //python:python_interface_smoke_test

      # 7️⃣ Run Python pytest suite
      - name: Run Python pytest suite
        run: |
          PYTHON_BIN="$(bazel cquery --output=files @python_3_14//:python3 | tail -n 1)"
          if [[ "${PYTHON_BIN}" != /* ]]; then
            PYTHON_BIN="$(bazel info execution_root)/${PYTHON_BIN}"
          fi

          "${PYTHON_BIN}" -m pip install --upgrade pip pytest
          export DDS_PYTHON_EXT_DIR="$(bazel info bazel-bin)/python"
          export PYTHONPATH="python:${DDS_PYTHON_EXT_DIR}"
          "${PYTHON_BIN}" -m pytest python/tests/ -v

      # 8️⃣ Run all tests
      - name: Run all tests
        run: bazel test //...
