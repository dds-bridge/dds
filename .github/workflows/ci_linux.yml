# .github/workflows/ci_linux.yml
name: CI – Linux

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install Bazelisk (recommended Bazel launcher)
      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@0.15.0
        # Optional: pin a specific Bazel version
        # with:
        #   bazel-version: 7.1.0

      # 3️⃣ (Optional) Install Doxygen for documentation generation
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      # 4️⃣ Build Python extension
      - name: Build Python extension
        run: bazelisk build //python:_dds3

      # 5️⃣ Build everything
      - name: Build all targets
        run: bazelisk build //...

      # 6️⃣ Run Python smoke test
      - name: Run Python smoke test
        run: bazelisk test //python:python_interface_smoke_test

      # 7️⃣ Run Python pytest suite
      - name: Run Python pytest suite
        run: |
          python3 -m pip install --upgrade pip pytest
          export PYTHONPATH=python:bazel-bin/python
          pytest python/tests/ -v

      # 8️⃣ Run all tests
      - name: Run all tests
        run: bazelisk test //...
