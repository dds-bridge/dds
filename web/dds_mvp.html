<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="dds_mvp.css">
    <title>
        DDS MVP
    </title>
</head>
<body onload="pageLoad()">
    <h1>
    Enter a 52-card deal using only these pips: <span id=valid-pips></span><br/>
    </h1>

    <button type="button" onclick="clearTestData()">Clear entries</button>
    <button type="button" onclick="fillFormWithGrandSlamTestData()">NS make 7 test deal</button>
    <button type="button" onclick="fillFormWithEveryoneMakes3nTestData()">Everyone makes 3N test deal</button>
    <button type="button" onclick="fillFormWithPartScoreTestData()">Part-score test deal</button>
    <button type="button" onclick="rotateClockwise()">Rotate the hands clockwise</button>

    <br/>
    <br/>

    <div class="grid-outer">
    <div class="grid-container">
        <div class="grid-item hand-north">
            <span class="hand-suit"><spade-suit>♠</spade-suit>&nbsp;<span id="north_spades_cards" class="hand-holding"></span><input id="north_spades" class="hand-suit-input" name="north spades" aria-label="North spades" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><heart-suit>♥</heart-suit>&nbsp;<span id="north_hearts_cards" class="hand-holding"></span><input id="north_hearts" class="hand-suit-input" name="north hearts" aria-label="North hearts" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><diamond-suit>♦</diamond-suit>&nbsp;<span id="north_diamonds_cards" class="hand-holding"></span><input id="north_diamonds" class="hand-suit-input" name="north diamonds" aria-label="North diamonds" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><club-suit>♣</club-suit>&nbsp;<span id="north_clubs_cards" class="hand-holding"></span><input id="north_clubs" class="hand-suit-input" name="north clubs" aria-label="North clubs" type="text" autocomplete="off" spellcheck="false"></span><br>
            <div id="north-card-count" class="hand-card-count" aria-live="polite" hidden></div>
        </div>
        <div class="grid-item hand-east">
            <span class="hand-suit"><spade-suit>♠</spade-suit>&nbsp;<span id="east_spades_cards" class="hand-holding"></span><input id="east_spades" class="hand-suit-input" name="east spades" aria-label="East spades" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><heart-suit>♥</heart-suit>&nbsp;<span id="east_hearts_cards" class="hand-holding"></span><input id="east_hearts" class="hand-suit-input" name="east hearts" aria-label="East hearts" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><diamond-suit>♦</diamond-suit>&nbsp;<span id="east_diamonds_cards" class="hand-holding"></span><input id="east_diamonds" class="hand-suit-input" name="east diamonds" aria-label="East diamonds" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><club-suit>♣</club-suit>&nbsp;<span id="east_clubs_cards" class="hand-holding"></span><input id="east_clubs" class="hand-suit-input" name="east clubs" aria-label="East clubs" type="text" autocomplete="off" spellcheck="false"></span><br>
            <div id="east-card-count" class="hand-card-count" aria-live="polite" hidden></div>
        </div>
        <div class="grid-item hand-south">
            <span class="hand-suit"><spade-suit>♠</spade-suit>&nbsp;<span id="south_spades_cards" class="hand-holding"></span><input id="south_spades" class="hand-suit-input" name="south spades" aria-label="South spades" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><heart-suit>♥</heart-suit>&nbsp;<span id="south_hearts_cards" class="hand-holding"></span><input id="south_hearts" class="hand-suit-input" name="south hearts" aria-label="South hearts" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><diamond-suit>♦</diamond-suit>&nbsp;<span id="south_diamonds_cards" class="hand-holding"></span><input id="south_diamonds" class="hand-suit-input" name="south diamonds" aria-label="South diamonds" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><club-suit>♣</club-suit>&nbsp;<span id="south_clubs_cards" class="hand-holding"></span><input id="south_clubs" class="hand-suit-input" name="south clubs" aria-label="South clubs" type="text" autocomplete="off" spellcheck="false"></span><br>
            <div id="south-card-count" class="hand-card-count" aria-live="polite" hidden></div>
        </div>
        <div class="grid-item hand-west">
            <span class="hand-suit"><spade-suit>♠</spade-suit>&nbsp;<span id="west_spades_cards" class="hand-holding"></span><input id="west_spades" class="hand-suit-input" name="west spades" aria-label="West spades" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><heart-suit>♥</heart-suit>&nbsp;<span id="west_hearts_cards" class="hand-holding"></span><input id="west_hearts" class="hand-suit-input" name="west hearts" aria-label="West hearts" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><diamond-suit>♦</diamond-suit>&nbsp;<span id="west_diamonds_cards" class="hand-holding"></span><input id="west_diamonds" class="hand-suit-input" name="west diamonds" aria-label="West diamonds" type="text" autocomplete="off" spellcheck="false"></span><br>
            <span class="hand-suit"><club-suit>♣</club-suit>&nbsp;<span id="west_clubs_cards" class="hand-holding"></span><input id="west_clubs" class="hand-suit-input" name="west clubs" aria-label="West clubs" type="text" autocomplete="off" spellcheck="false"></span><br>
            <div id="west-card-count" class="hand-card-count" aria-live="polite" hidden></div>
        </div>
        <div class="grid-item grid-filler grid-filler-nw" aria-hidden="true"></div>
        <div class="grid-item grid-filler grid-filler-ne">
            <div id="contract-status" hidden></div>
        </div>
        <div class="grid-item grid-filler grid-filler-center" aria-hidden="true"></div>
        <div class="grid-item grid-filler grid-filler-sw" aria-hidden="true"></div>
        <div class="grid-item grid-filler grid-filler-se">
            <div class="result-table-hint">Click to set declarer and denomination</div>
            <table id="result-table"
                   cellspacing="2"
                   cellpadding="2"
                   border="1">
               <tr>
                    <th valign="top"></th>
                    <th valign="top"><club-suit>♣</club-suit></th>
                    <th valign="top"><diamond-suit>♦</diamond-suit></th>
                    <th valign="top"><heart-suit>♥</heart-suit></th>
                    <th valign="top"><spade-suit>♠</spade-suit></th>
                    <th valign="top">NT</th>
                </tr>
                <tr>
                    <th valign="top">N</th>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                </tr>
                <tr>
                    <th valign="top">E</th>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                </tr>
                <tr>
                    <th valign="top">S</th>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                </tr>
                <tr>
                    <th valign="top">W</th>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                    <td valign="top"><br></td>
                </tr>
            </table>
        </div>
    </div>
    </div>

    <br/>

    <div id="deck-status"
         aria-label="All cards; entered cards are grayed out"></div>

    <p id="result"></p>

    <script src="dds_mvp_wasm_bin.js"></script>
    <script src="dds_mvp_wasm.js"></script>
    <script src="dds_mvp.js"></script>
</body>
</html>
