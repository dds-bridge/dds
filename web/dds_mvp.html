<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="dds_mvp.css">
    <title>
        DDS MVP
    </title>
</head>
<body onload="pageLoad()">
    <h1>
    Enter a 52-card deal using only these pips: <span id=valid-pips></span><br/>
    </h1>

    <button type="button" onclick="clearTestData()">Clear entries</button>
    <button type="button" onclick="fillFormWithGrandSlamTestData()">NS make 7 test deal</button>
    <button type="button" onclick="fillFormWithEveryoneMakes3nTestData()">Everyone makes 3N test deal</button>
    <button type="button" onclick="fillFormWithPartScoreTestData()">Part-score test deal</button>
    <button type="button" onclick="rotateClockwise()">Rotate the hands clockwise</button>

    <br/>
    <br/>

    <div class="grid-outer">
    <div class="grid-container">
        <div class="grid-item hand-north">
            <spade-suit>♠</spade-suit>&nbsp;<input id="north_spades" name="north spades" type="text"><br>
            <heart-suit>♥</heart-suit>&nbsp;<input id="north_hearts" name="north hearts" type="text"><br>
            <diamond-suit>♦</diamond-suit>&nbsp;<input id="north_diamonds" name="north diamonds" type="text"><br>
            <club-suit>♣</club-suit>&nbsp;<input id="north_clubs" name="north clubs" type="text"><br>
            <div id="north-card-count" class="hand-card-count" aria-live="polite" hidden></div>
        </div>
        <div class="grid-item hand-east">
            <spade-suit>♠</spade-suit>&nbsp;<input id="east_spades" name="east spades" type="text"><br>
            <heart-suit>♥</heart-suit>&nbsp;<input id="east_hearts" name="east hearts" type="text"><br>
            <diamond-suit>♦</diamond-suit>&nbsp;<input id="east_diamonds" name="east diamonds" type="text"><br>
            <club-suit>♣</club-suit>&nbsp;<input id="east_clubs" name="east clubs" type="text"><br>
            <div id="east-card-count" class="hand-card-count" aria-live="polite" hidden></div>
        </div>
        <div class="grid-item hand-south">
            <spade-suit>♠</spade-suit>&nbsp;<input id="south_spades" name="south spades" type="text"><br>
            <heart-suit>♥</heart-suit>&nbsp;<input id="south_hearts" name="south hearts" type="text"><br>
            <diamond-suit>♦</diamond-suit>&nbsp;<input id="south_diamonds" name="south diamonds" type="text"><br>
            <club-suit>♣</club-suit>&nbsp;<input id="south_clubs" name="south clubs" type="text"><br>
            <div id="south-card-count" class="hand-card-count" aria-live="polite" hidden></div>
        </div>
        <div class="grid-item hand-west">
            <spade-suit>♠</spade-suit>&nbsp;<input id="west_spades" name="west spades" type="text"><br>
            <heart-suit>♥</heart-suit>&nbsp;<input id="west_hearts" name="west hearts" type="text"><br>
            <diamond-suit>♦</diamond-suit>&nbsp;<input id="west_diamonds" name="west diamonds" type="text"><br>
            <club-suit>♣</club-suit>&nbsp;<input id="west_clubs" name="west clubs" type="text"><br>
            <div id="west-card-count" class="hand-card-count" aria-live="polite" hidden></div>
        </div>
        <div class="grid-item grid-filler grid-filler-nw" aria-hidden="true"></div>
        <div class="grid-item grid-filler grid-filler-ne" aria-hidden="true"></div>
        <div class="grid-item grid-filler grid-filler-center" aria-hidden="true"></div>
        <div class="grid-item grid-filler grid-filler-sw" aria-hidden="true"></div>
        <div class="grid-item grid-filler grid-filler-se" aria-hidden="true"></div>
    </div>
    </div>

    <br/>

    <div id="deck-status"
         aria-label="All cards; entered cards are grayed out"></div>

    <br/>

    <button type="button" id="double-dummy-it" onclick="sendJSON()" disabled>Double-dummy it!</button>

    <p id="result"></p>

    <table id="result-table"
           width="25%"
           cellspacing="2"
           cellpadding="2"
           border="1">
       <tr>
            <th valign="top"></th>
            <th valign="top"><club-suit>♣</club-suit></th>
            <th valign="top"><diamond-suit>♦</diamond-suit></th>
            <th valign="top"><heart-suit>♥</heart-suit></th>
            <th valign="top"><spade-suit>♠</spade-suit></th>
            <th valign="top">NT</th>
        </tr>
        <tr>
            <th valign="top">N</th>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
        </tr>
        <tr>
            <th valign="top">E</th>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
        </tr>
        <tr>
            <th valign="top">S</th>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
        </tr>
        <tr>
            <th valign="top">W</th>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
            <td valign="top"><br></td>
        </tr>
    </table>

    <script src="dds_mvp_wasm_bin.js"></script>
    <script src="dds_mvp_wasm.js"></script>
    <script src="dds_mvp.js"></script>
</body>
</html>
